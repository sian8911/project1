<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nyan Cat 3D Space</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020617;
      }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      // ── Scene Setup ──────────────────────────────────────────────────
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a1628);

      const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 500);
      camera.position.set(0, 6, 18);
      camera.lookAt(0, 0, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(devicePixelRatio);
      document.body.appendChild(renderer.domElement);

      window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      // ── Lights ───────────────────────────────────────────────────────
      scene.add(new THREE.AmbientLight(0xffffff, 0.6));
      const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
      dirLight.position.set(5, 8, 10);
      scene.add(dirLight);

      // ── Stars ────────────────────────────────────────────────────────
      (function makeStars() {
        const geo = new THREE.BufferGeometry();
        const pos = [];
        for (let i = 0; i < 1200; i++) {
          const r = 120, phi = Math.random() * Math.PI * 2,
                ct = Math.random() * 2 - 1, th = Math.acos(ct);
          pos.push(r * Math.sin(th) * Math.cos(phi),
                   r * Math.sin(th) * Math.sin(phi),
                   r * Math.cos(th));
        }
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        scene.add(new THREE.Points(geo,
          new THREE.PointsMaterial({ color: 0xffffff, size: 0.35 })));
      })();

      // ── Pixel helper: voxel box ───────────────────────────────────────
      function voxel(color, x, y, z, sx = 1, sy = 1, sz = 1) {
        const m = new THREE.Mesh(
          new THREE.BoxGeometry(sx, sy, sz),
          new THREE.MeshLambertMaterial({ color })
        );
        m.position.set(x, y, z);
        return m;
      }

      // ── Build a Nyan Cat group ────────────────────────────────────────
      function makeNyanCat() {
        const g = new THREE.Group();
        const U = 0.5; // unit size

        // ─ Toast body (pink frosting top, bread body) ─
        // bread base
        const bread = voxel(0xd4a96a, 0, 0, 0, 4*U, 3*U, U*1.4);
        g.add(bread);
        // pink frosting
        const frost = voxel(0xf48fbf, 0, 0.3*U, U*0.2, 3.6*U, 2.0*U, U*0.5);
        g.add(frost);
        // sprinkles
        [[-0.6, 0.6], [0, 0.2], [0.6, 0.6], [-0.3, -0.1], [0.3, 0.0]].forEach(([dx, dy]) => {
          const sp = voxel(
            [0xff4444, 0xdd44ff, 0x44ddff, 0xffdd44][Math.floor(Math.random()*4)],
            dx * U, dy * U, U * 0.46, U*0.28, U*0.18, U*0.18
          );
          g.add(sp);
        });

        // ─ Cat head ─
        const head = voxel(0x888888, 1.5*U, 0.9*U, 0, 1.6*U, 1.6*U, 1.6*U);
        g.add(head);
        // ears
        [[-0.4, 1.2], [0.4, 1.2]].forEach(([ex, ey]) => {
          g.add(voxel(0x888888, (1.5 + ex) * U, ey*U, 0, U*0.5, U*0.6, U*0.8));
          g.add(voxel(0xffaaaa, (1.5 + ex) * U, (ey-0.1)*U, U*0.1, U*0.22, U*0.3, U*0.6));
        });
        // eyes
        [[-0.25, 0.9], [0.25, 0.9]].forEach(([ex, ey]) => {
          g.add(voxel(0x111111, (1.5+ex)*U, ey*U, U*0.81, U*0.3, U*0.3, U*0.1));
        });
        // cheeks
        [[-0.35, 0.5], [0.35, 0.5]].forEach(([ex, ey]) => {
          g.add(voxel(0xffaaaa, (1.5+ex)*U, ey*U, U*0.81, U*0.4, U*0.22, U*0.08));
        });
        // mouth
        g.add(voxel(0x444444, 1.5*U, 0.35*U, U*0.81, U*0.18, U*0.12, U*0.08));
        // nose
        g.add(voxel(0xffcccc, 1.5*U, 0.55*U, U*0.81, U*0.18, U*0.1, U*0.08));

        // ─ Legs (4 stumps) ─
        [[-0.7, -1.4], [-0.2, -1.4], [0.3, -1.4], [0.8, -1.4]].forEach(([lx, ly]) => {
          g.add(voxel(0x777777, lx*U, ly*U, 0, U*0.5, U*0.65, U*0.9));
        });

        // ─ Tail ─
        const tail = voxel(0x777777, -2.6*U, -0.5*U, 0, U*0.4, U*0.4, U*0.4);
        g.add(tail);
        const tail2 = voxel(0x777777, -2.3*U, -0.1*U, 0, U*0.4, U*0.9, U*0.4);
        g.add(tail2);

        // ─ Rainbow trail ─
        const rainbowColors = [0xff0000, 0xff7700, 0xffff00, 0x00cc00, 0x0066ff, 0x8800cc];
        rainbowColors.forEach((col, i) => {
          const stripe = voxel(col, -3.5*U - i*0.3*U, (1.2 - i*0.4)*U, -0.1, 6*U + i*0.3*U, U*0.42, U*0.3);
          g.add(stripe);
        });

        return g;
      }

      // ── Instantiate 3 Nyan Cats in orbit ────────────────────────────
      const cats = [];
      const orbitData = [
        { radius: 5.5,  speed: 0.012, tilt: 0.24,  scale: 0.9  },
        { radius: 8.5,  speed: 0.007, tilt: -0.18, scale: 1.3  },
        { radius: 11.5, speed: 0.004, tilt: 0.12,  scale: 0.75 },
      ];

      orbitData.forEach((od, idx) => {
        const cat = makeNyanCat();
        cat.scale.setScalar(od.scale);
        scene.add(cat);
        cats.push({ cat, ...od, angle: (idx * Math.PI * 2) / 3 });
      });

      // ── Star pixel sparkles (like original Nyan Cat BG) ──────────────
      const sparkleGeo = new THREE.BufferGeometry();
      const sparklePos = [];
      for (let i = 0; i < 80; i++) {
        sparklePos.push(
          (Math.random() - 0.5) * 40,
          (Math.random() - 0.5) * 25,
          (Math.random() - 0.5) * 10 - 3
        );
      }
      sparkleGeo.setAttribute('position', new THREE.Float32BufferAttribute(sparklePos, 3));
      const sparkleMesh = new THREE.Points(sparkleGeo,
        new THREE.PointsMaterial({ color: 0xffffff, size: 0.22 }));
      scene.add(sparkleMesh);

      // ── Animation loop ───────────────────────────────────────────────
      let t = 0;
      function animate() {
        requestAnimationFrame(animate);
        t += 1;

        cats.forEach(od => {
          od.angle += od.speed;

          // 고양이가 직접 원형 궤도를 돌게 위치 계산
          od.cat.position.x = Math.cos(od.angle) * od.radius;
          od.cat.position.z = Math.sin(od.angle) * od.radius;
          od.cat.position.y = Math.sin(od.tilt) * od.radius * Math.sin(od.angle)
                            + Math.sin(t * 0.03 + od.radius) * 0.3;

          // 진행 방향(접선 방향)을 바라보도록 회전
          od.cat.rotation.y = -(od.angle + Math.PI / 2);
          od.cat.rotation.z = Math.sin(t * 0.04) * 0.08;
        });

        // twinkle sparkles
        sparkleMesh.rotation.y += 0.001;

        renderer.render(scene, camera);
      }
      animate();

      // ── 카메라는 고정, 마우스 드래그로 각도 조절 가능 ──────────────────
      let isDragging = false, prevX = 0, prevY = 0;
      let camTheta = 0, camPhi = Math.PI / 2.4, camR = 18;

      function updateCamera() {
        camera.position.x = camR * Math.sin(camPhi) * Math.sin(camTheta);
        camera.position.y = camR * Math.cos(camPhi);
        camera.position.z = camR * Math.sin(camPhi) * Math.cos(camTheta);
        camera.lookAt(0, 0, 0);
      }
      updateCamera(); // 초기 위치 설정

      renderer.domElement.addEventListener('mousedown', e => { isDragging = true; prevX = e.clientX; prevY = e.clientY; });
      window.addEventListener('mouseup', () => { isDragging = false; });
      window.addEventListener('mousemove', e => {
        if (!isDragging) return;
        camTheta += (e.clientX - prevX) * 0.005;
        camPhi   = Math.max(0.2, Math.min(Math.PI - 0.2, camPhi + (e.clientY - prevY) * 0.005));
        prevX = e.clientX; prevY = e.clientY;
        updateCamera();
      });
      renderer.domElement.addEventListener('wheel', e => {
        camR = Math.max(5, Math.min(40, camR + e.deltaY * 0.02));
        updateCamera();
      });
    </script>
  </body>
</html>
